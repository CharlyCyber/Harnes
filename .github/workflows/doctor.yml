name: doctor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doctor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r sync/requirements.txt
      - run: python -m unittest discover -s sync/tests -p 'test_*.py'
      - run: python sync/harnes.py doctor --skip-sync
      - run: python -c "import ast,pathlib; files=list(pathlib.Path('skills').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8-sig'), str(p)) for p in files]; print(len(files), 'Python scripts OK')"
      - name: PowerShell 5.1 wrapper
        if: runner.os == 'Windows'
        shell: powershell
        run: ./sync/tests/run-tests.ps1
      - name: PowerShell 7 wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./sync/tests/run-tests.ps1
      - name: Tests JavaScript de skills
        if: runner.os == 'Linux'
        shell: bash
        run: node --test $(git ls-files '*test.mjs')
